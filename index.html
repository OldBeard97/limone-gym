<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Limone Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Silkscreen&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F0FAF3; --surface:#FFFFFF; --surface-2:#E6EFE9; --ink:#0A2A1A; --num:#101814; --muted:#4F6B5A; --line:#D5E9DB;
  --g50:#E6FCE8; --g100:#C4F7CA; --chip:#DEF8E7; --g500:#31DA62; --g600:#1DBD51; --g700:#0E9A3F; --g800:#0C7830; --g900:#0A5722;
  --amber:#9A5B00; --amber-bg:#FFF1D6; --danger:#B3261E; --shadow:0 10px 30px rgba(10,42,26,.14);
  --display:"Silkscreen","Courier New",monospace;
  --body:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.35}
:focus-visible{outline:2px solid var(--g800);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 170px}
.label{font-family:var(--display);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.section{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.row{display:flex;align-items:center;gap:8px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px;padding:0 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-go{border:0;background:var(--g500);color:#05240F;border-radius:14px;min-height:50px;padding:0 18px;font-weight:800;font-size:16px;box-shadow:0 4px 0 var(--g700)}
.btn-go:active{transform:translateY(2px);box-shadow:0 2px 0 var(--g700)}
.btn-ghost{border:0;background:transparent;min-height:44px;padding:0 6px;font-weight:700;color:var(--g800)}
.btn-danger{border:1px solid var(--danger);color:var(--danger);background:transparent;border-radius:12px;min-height:44px;padding:0 14px;font-weight:700}
.btn-danger.solid{background:var(--danger);color:#fff}
.input{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:46px;padding:0 12px;font-size:16px;width:100%;color:var(--ink)}
textarea.input{padding:10px 12px;min-height:84px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}

/* benvenuto */
.welcome{min-height:100vh;min-height:100dvh;margin-inline:-16px;background:var(--g50);display:flex;flex-direction:column}
.welcome-art{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 16px 20px;position:relative}
.welcome-art svg{width:min(300px,80vw);height:auto}
.welcome-art .brand{font-family:var(--display);font-size:15px;letter-spacing:.2em;color:var(--g800)}
.dot{position:absolute;border-radius:50%}
.welcome-form{background:var(--surface);border-radius:30px 30px 0 0;box-shadow:0 -8px 24px rgba(10,42,26,.08);padding:28px 24px 36px;display:flex;flex-direction:column;gap:16px}
.welcome-form h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.4px;text-wrap:balance}
.sexseg{display:flex;gap:8px}
.sexopt{flex:1;position:relative}
.sexopt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sexopt span{display:flex;align-items:center;justify-content:center;min-height:46px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700}
.sexopt input:checked + span{border-color:var(--g800);background:var(--g50);color:var(--g800)}
.sexopt input:focus-visible + span{outline:2px solid var(--g800);outline-offset:2px}
.spread > .btn{flex:none;white-space:nowrap}
.app.bare{padding-bottom:0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.welcome-form .input.big{min-height:54px;border:2px solid var(--g800);border-radius:14px;font-size:18px;padding:0 16px}
.setrow.cw{grid-template-columns:30px 1fr 1fr 1fr 44px 30px}
.setrow.cm{grid-template-columns:30px 1fr 1.6fr 44px 30px}
.setrow select.input{padding:0 6px;text-align:center;min-height:44px}

/* testata */
.hero{margin-inline:-16px;background:var(--g800);border-radius:0 0 28px 28px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:14px;color:#fff}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hello{font-family:var(--display);font-size:13px;letter-spacing:.14em;color:var(--g100)}
.name{font-family:var(--display);font-size:34px;line-height:1.05;color:#fff;word-break:break-word}
.hero-sub{font-size:14px;color:var(--g100)}
.icon-btn{width:44px;height:44px;flex:none;border-radius:12px;border:0;background:var(--g900);color:#fff;display:flex;align-items:center;justify-content:center}
.weeknav{display:flex;gap:8px}
.week-label{flex:1;height:44px;border-radius:12px;border:0;background:var(--g900);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--g900);border-radius:16px;padding:12px 10px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--g100)}
.day i{width:20px;height:20px;border-radius:4px;background:var(--g700);display:block}
.day.on i{background:var(--g500);box-shadow:inset -3px -3px 0 #14A846}
.day.today span{color:#fff;font-weight:800}

/* riquadri */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;text-align:left}
.stat b{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.1;color:var(--num)}
.stat span{font-size:12px;line-height:1.3;color:var(--muted)}
.trend{display:flex;align-items:center;gap:6px}
.trend b{font-size:15px}
.arrow{width:26px;height:26px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center}
.arrow.su{background:var(--g50);color:var(--g800)} .arrow.pari{background:var(--surface-2);color:var(--muted)} .arrow.giu{background:var(--amber-bg);color:var(--amber)}

/* lista allenamenti */
.wlist{display:flex;flex-direction:column;gap:10px}
.wcard{display:flex;flex-direction:column;gap:7px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.wcard:active{background:var(--surface-2)}
.wcard .date{font-size:12px;color:var(--muted);text-transform:capitalize}
.wcard .wname{font-weight:700;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:var(--chip);color:var(--g800);border-radius:999px;padding:3px 10px}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:22px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.empty svg{width:90px;height:auto}

/* testata semplice (esercizi) */
.bar{margin-inline:-16px;background:var(--g800);border-radius:0 0 24px 24px;padding:22px 20px 18px;color:#fff;display:flex;flex-direction:column;gap:4px}
.bar h1{margin:0;font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.04em}
.bar p{margin:0;font-size:14px;color:var(--g100)}
.filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.fchip{border:0;min-height:36px;padding:0 14px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600;flex:none}
.fchip.on{background:var(--g800);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.excard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.excard canvas,.excard .thumbimg{width:100%;aspect-ratio:4/3;border-radius:10px;image-rendering:pixelated;display:block;object-fit:cover}
.excard b{font-size:14px;line-height:1.25}
.excard span{font-size:12px;color:var(--muted)}
.thumbimg{background:#E3F4E8;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumbimg svg{width:70%;height:auto}

/* dettaglio esercizio */
.exhero{display:flex;gap:12px;align-items:center}
.exhero canvas,.exhero .thumbimg{width:128px;height:96px;border-radius:14px;image-rendering:pixelated;flex:none;object-fit:cover}
.exhero h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.3px;line-height:1.15}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;font-size:13px;font-weight:600}
.seg button.on{background:var(--g800);color:#fff;font-weight:700}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .hit{cursor:pointer}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* editor */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:14px}
.wtitle{width:100%;border:0;border-bottom:3px solid var(--g500);background:transparent;font-size:26px;font-weight:800;letter-spacing:-.4px;padding:4px 0 6px;border-radius:0}
.wtitle:focus{outline:none;border-bottom-color:var(--g800)}
.whead{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;align-items:end;margin-top:12px}
.box{height:46px;border-radius:12px;background:var(--g800);padding:0 12px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.box b{font-family:var(--display);font-weight:400;font-size:16px;line-height:1;color:#fff}
.box span{font-size:11px;line-height:1.1;color:var(--g100)}
.exblock{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.exhead{display:flex;align-items:center;gap:10px}
.exhead canvas,.exhead .thumbimg{width:64px;height:48px;border-radius:10px;image-rendering:pixelated;flex:none;object-fit:cover}
.exname{background:none;border:0;padding:0;text-align:left;font-weight:700;font-size:17px;text-decoration:underline;text-decoration-color:var(--g500);text-decoration-thickness:3px;text-underline-offset:4px}
.exmeta{font-size:12px;color:var(--muted)}
.rest{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step{width:36px;height:36px;border-radius:10px;border:0;background:#E3F2E8;font-weight:800;font-size:18px}
.restval{font-family:var(--display);min-width:46px;text-align:center;color:var(--g800)}
.btn-start{margin-left:auto;height:38px;padding:0 14px;border-radius:10px;border:0;background:var(--g500);color:#05240F;font-weight:700;display:flex;align-items:center;gap:6px}
.sets{display:flex;flex-direction:column;gap:6px}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 44px 30px;gap:6px;align-items:center}
.sethead{font-family:var(--display);font-size:10px;letter-spacing:.08em;color:var(--muted);text-align:center}
.setrow .n{font-family:var(--display);text-align:center;color:var(--muted)}
.setrow input{text-align:center;padding:0 4px;min-height:44px}
.setrow.done input{background:var(--g50);border-color:var(--g500)}
.check{width:44px;height:44px;border-radius:10px;border:2px solid #C4DCCB;background:var(--surface);font-weight:800;font-size:18px;color:transparent}
.setrow.done .check{background:var(--g500);border-color:var(--g500);color:#05240F}
.del{width:30px;height:32px;border:0;background:transparent;color:var(--muted);font-size:18px}
.last{font-size:12px;color:var(--muted);text-align:right}
.confirm{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--surface-2);border-radius:12px;padding:10px}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 0;min-height:56px}
.pick canvas,.pick .thumbimg{width:52px;height:39px;border-radius:8px;image-rendering:pixelated;flex:none;object-fit:cover}
.weekrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:56px}
.weekrow.on{border:2px solid var(--g800)}
.backup{display:flex;flex-direction:column;gap:10px}
.backup.warn{border-color:#E7C878;background:#FFF8E6}

/* barra in basso */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.nav > button{border:0;background:transparent;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:#7F9A8A}
.nav > button.on{color:var(--g800);font-weight:800}
.nav svg.pix{width:22px;height:22px;shape-rendering:crispEdges}
.nav-mid{display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:-34px;font-size:12px;font-weight:800;color:var(--g800)}
.fab{position:relative;width:72px;height:72px;border-radius:50%;border:5px solid var(--surface);background:var(--g500);box-shadow:0 6px 18px rgba(49,218,98,.45);display:flex;align-items:center;justify-content:center;padding:0}
.fab svg{width:50px;height:auto}
.fab-plus{position:absolute;right:-4px;top:-4px;width:24px;height:24px;border-radius:50%;background:var(--num);color:#fff;font-size:17px;font-weight:800;line-height:24px;text-align:center}
.fab:active{transform:scale(.96)}

/* timer */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
.timer .in{max-width:536px;margin:0 auto;background:var(--g900);border:1px solid var(--g800);color:#fff;border-radius:18px;padding:12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 24px rgba(10,87,34,.35)}
.timer .t{font-family:var(--display);font-size:32px;line-height:1;min-width:94px;color:var(--g500)}
.timer .lbl{flex:1;min-width:0;font-size:12px;color:var(--g100);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer button{border:0;background:var(--g800);color:#fff;border-radius:10px;min-width:44px;height:40px;font-weight:700}
.timer.ring .in{animation:ring .5s steps(2) 6}
@keyframes ring{50%{background:var(--g500);color:#05240F}}

/* fogli */
.sheet-wrap{position:fixed;inset:0;z-index:40}
.sheet-backdrop{position:absolute;inset:0;background:rgba(6,24,14,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:90%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto;flex:none}
.sheet h2{margin:0;font-size:21px;text-wrap:balance}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;background:var(--num);color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.timer.ring .in{animation:none}}

/* ---------- cibo e peso ---------- */
.nav{grid-template-columns:1fr 1fr auto 1fr 1fr;padding-inline:6px}
.nav > button{font-size:11px;min-width:0}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bar .weeknav{margin-top:10px}
.kpanel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.kbig{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.kbig b{font-family:var(--display);font-weight:400;font-size:32px;line-height:1;color:var(--num)}
.kbig span{color:var(--muted);font-size:14px}
.track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;border-radius:5px;background:var(--g500)}
.track.warn i{background:#E0A020}.track.bad i{background:var(--danger)}.track.over i{background:var(--g800)}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.macro{display:flex;flex-direction:column;gap:5px;min-width:0}
.macro .mt{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.macro b{font-size:15px;color:var(--num)}
.macro .mv{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--g50);color:var(--g800)}.pill.warn{background:var(--amber-bg);color:var(--amber)}.pill.bad{background:#FCE8E6;color:var(--danger)}
.verdict{border-radius:12px;padding:10px 12px;font-size:14px;background:var(--surface-2);color:var(--ink)}
.verdict.ok{background:var(--g50);color:#0A3D1C}.verdict.warn{background:var(--amber-bg);color:#5C3700}.verdict.bad{background:#FCE8E6;color:#7A1A14}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:4px}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:4px}
.meal-h b{font-size:16px}
.fitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:9px 0;min-height:50px}
.fitem .fn{flex:1;min-width:0}
.fitem .fn > div:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem .fk{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap;line-height:1.35}
.fitem .fk b{color:var(--num)}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.tag.est{background:var(--amber-bg);color:var(--amber)}
.meal-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:6px}
.meal-a .btn{min-height:40px;font-size:14px}
.ai{background:var(--surface);border:2px solid var(--g500);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ai textarea.input{min-height:88px}
.ai-row{display:grid;grid-template-columns:26px minmax(0,1fr) 74px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ai-row input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:var(--g800)}
.ai-row .input{min-height:42px;text-align:center;padding:0 6px}
.ai-row .an{font-weight:600;line-height:1.3}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.chiprow .fchip{min-height:38px}
.rem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--amber-bg);border:0;border-radius:12px;padding:10px 12px;min-height:46px;color:#5C3700;font-size:14px;font-weight:600}
.rem i{font-style:normal;font-family:var(--display);flex:none;width:22px;height:22px;border-radius:6px;background:#F3C765;color:#5C3700;display:flex;align-items:center;justify-content:center;font-size:12px}
.wrow{display:flex;gap:8px;align-items:stretch}

<script>
/* ---------- motore pixel ---------- */
const PAL = {bg:'#E3F4E8', floor:'#C6E6D0', mat:'#C6E6D0', prop:'#9CC7A9', dark:'#5E8F6E', weight:'#23452F',
  limb:'#0A2A1A', far:'#7FA88C', shirt:'#31DA62', shorts:'#0C7830', cable:'#5E8F6E', hi:'#C9D59C'};
const PW = 64, PH = 48;

function pxLine(ctx, a, b, t, c){
  let x0 = Math.round(a[0]), y0 = Math.round(a[1]); const x1 = Math.round(b[0]), y1 = Math.round(b[1]);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy; const o = Math.floor(t / 2); ctx.fillStyle = PAL[c] || c;
  for(let guard = 0; guard < 400; guard++){
    ctx.fillRect(x0 - o, y0 - o, t, t);
    if(x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if(e2 >= dy){ err += dy; x0 += sx; }
    if(e2 <= dx){ err += dx; y0 += sy; }
  }
}
function pxDisc(ctx, p, r, c){
  ctx.fillStyle = PAL[c] || c; const cx = Math.round(p[0]), cy = Math.round(p[1]);
  for(let y = -r; y <= r; y++) for(let x = -r; x <= r; x++) if(x*x + y*y <= r*r + r*0.8) ctx.fillRect(cx + x, cy + y, 1, 1);
}
function pxRect(ctx, a, b, c){
  ctx.fillStyle = PAL[c] || c;
  const x = Math.round(Math.min(a[0], b[0])), y = Math.round(Math.min(a[1], b[1]));
  ctx.fillRect(x, y, Math.round(Math.abs(b[0] - a[0])) + 1, Math.round(Math.abs(b[1] - a[1])) + 1);
}
function drawProp(ctx, p){
  if(p.t === 'line') pxLine(ctx, p.a, p.b, p.w || 1, p.c || 'prop');
  else if(p.t === 'rect') pxRect(ctx, p.a, p.b, p.c || 'prop');
  else if(p.t === 'plate'){ pxDisc(ctx, p.p, p.r, 'weight'); if(p.r > 2) pxDisc(ctx, p.p, 1, 'prop'); }
}
const lerpP = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
function mix(a, b, t){
  if(typeof a === 'number') return a + (b - a) * t;
  if(Array.isArray(a)) return a.map((v, i) => mix(v, b[i], t));
  if(a && typeof a === 'object'){ const o = {}; for(const k in a) o[k] = (b && k in b) ? mix(a[k], b[k], t) : a[k]; return o; }
  return a;
}
function drawSide(ctx, j){
  if(j.k2){ pxLine(ctx, j.hp, j.k2, 3, 'far'); pxLine(ctx, j.k2, j.f2, 2, 'far'); pxLine(ctx, j.f2, j.t2 || [j.f2[0] + 3, j.f2[1]], 2, 'far'); }
  if(j.e2){ pxLine(ctx, j.n, j.e2, 2, 'far'); pxLine(ctx, j.e2, j.w2, 2, 'far'); }
  pxLine(ctx, j.hp, j.k, 3, 'limb');
  pxLine(ctx, j.k, j.f, 2, 'limb');
  pxLine(ctx, j.f, j.t || [j.f[0] + 3, j.f[1]], 2, 'limb');
  pxLine(ctx, j.n, j.hp, 6, 'shirt');
  pxLine(ctx, j.hp, lerpP(j.hp, j.k, .45), 5, 'shorts');
  pxDisc(ctx, j.h, 3, 'limb');
  pxLine(ctx, j.n, j.e, 2, 'limb');
  pxLine(ctx, j.e, j.w, 2, 'limb');
}
function drawFront(ctx, j){
  pxLine(ctx, j.hL, j.kL, 3, 'limb'); pxLine(ctx, j.kL, j.fL, 2, 'limb'); pxLine(ctx, j.fL, [j.fL[0] - 2, j.fL[1]], 2, 'limb');
  pxLine(ctx, j.hR, j.kR, 3, 'limb'); pxLine(ctx, j.kR, j.fR, 2, 'limb'); pxLine(ctx, j.fR, [j.fR[0] + 2, j.fR[1]], 2, 'limb');
  pxLine(ctx, [j.hL[0], j.hL[1] + 1], [j.hR[0], j.hR[1] + 1], 4, 'shorts');
  pxLine(ctx, j.n, j.hp, 7, 'shirt');
  pxLine(ctx, j.sL, j.sR, 3, 'shirt');
  pxDisc(ctx, j.h, 3, 'limb');
  pxLine(ctx, j.sL, j.eL, 2, 'limb'); pxLine(ctx, j.eL, j.wL, 2, 'limb');
  pxLine(ctx, j.sR, j.eR, 2, 'limb'); pxLine(ctx, j.eR, j.wR, 2, 'limb');
}
const FRAMES = [0, 0, 0, .12, .35, .65, .88, 1, 1, 1, .88, .62, .35, .12];
function drawPose(ctx, ex, t){
  ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, PW, PH);
  pxRect(ctx, [0, 46], [63, 47], 'floor');
  const pose = mix(ex.A, ex.B, t);
  (ex.bg || []).forEach(p => drawProp(ctx, p));
  (pose.p || []).filter(p => !p.f).forEach(p => drawProp(ctx, p));
  (ex.v === 'F' ? drawFront : drawSide)(ctx, pose.j);
  (pose.p || []).filter(p => p.f).forEach(p => drawProp(ctx, p));
  (ex.fg || []).forEach(p => drawProp(ctx, p));
}

/* ---------- animazione ---------- */
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const animated = new Set();
function mountPose(canvas, ex, animate){
  canvas.width = PW; canvas.height = PH;
  const ctx = canvas.getContext('2d');
  canvas._ex = ex; canvas._ctx = ctx;
  drawPose(ctx, ex, animate && !REDUCED ? 0 : .5);
  if(animate && !REDUCED) animated.add(canvas);
}
let frameI = 0;
setInterval(() => {
  frameI = (frameI + 1) % FRAMES.length;
  for(const c of animated){
    if(!c.isConnected){ animated.delete(c); continue; }
    drawPose(c._ctx, c._ex, FRAMES[(frameI + (c._off || 0)) % FRAMES.length]);
  }
}, 140);

/* ---------- foto (ridotte prima di salvarle) ---------- */
function loadImage(file){
  return new Promise((res, rej) => { const u = URL.createObjectURL(file); const im = new Image();
    im.onload = () => { res(im); URL.revokeObjectURL(u); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); }; im.src = u; });
}
async function photoCanvas(file, max){
  const im = await loadImage(file); const sc = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * sc); c.height = Math.round(im.naturalHeight * sc);
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); return c;
}
async function photoToDataURL(file){
  try{ return (await photoCanvas(file, 480)).toDataURL('image/jpeg', .72); }
  catch(e){ toast('Non riesco a leggere questa foto: prova con un JPG o PNG.'); return null; }
}
async function photoToBlob(file){
  const c = await photoCanvas(file, 1000);
  return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', .85));
}

/* ---------- settimane ---------- */
function weekStart(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function weekRange(offset){
  const s = weekStart(new Date()); s.setDate(s.getDate() + offset * 7);
  const days = [...Array(7)].map((_, i) => isoOf(new Date(s.getFullYear(), s.getMonth(), s.getDate() + i)));
  return {start:days[0], end:days[6], days};
}
function weekLabel(r){
  const a = parseISO(r.start), b = parseISO(r.end), y = new Date().getFullYear();
  const m = d => d.toLocaleDateString('it-IT', {month:'long'});
  let t = a.getMonth() === b.getMonth() ? `${a.getDate()} – ${b.getDate()} ${m(b)}` : `${a.getDate()} ${m(a).slice(0, 3)} – ${b.getDate()} ${m(b).slice(0, 3)}`;
  if(b.getFullYear() !== y) t += ` ${b.getFullYear()}`;
  return t;
}
const inRange = (w, r) => w.date >= r.start && w.date <= r.end;
function offsetOfDate(iso){ const a = weekStart(parseISO(iso)), b = weekStart(new Date()); return Math.round((a - b) / (7 * 86400000)); }

/* ---------- calcoli ---------- */
const isCardio = e => { const ex = getEx(e.exId); return !!((ex && ex.kind === 'cardio') || e.kind === 'cardio'); };
function summary(w){
  let sets = 0, vol = 0;
  (w.exercises || []).forEach(e => { if(isCardio(e)) return; (e.sets || []).forEach(s => { const r = num(s.reps), k = num(s.kg); if(r){ sets++; if(k) vol += r * k; } }); });
  return {sets, vol};
}
/* metabolismo a riposo: Mifflin-St Jeor se ci sono sesso, età e altezza; altrimenti stima prudente dal solo peso */
function bmrOf(p){
  const w = num(p.weight), h = num(p.height), a = num(p.age);
  if(!w || !h || !a || (p.sex !== 'M' && p.sex !== 'F')) return null;
  return 10 * w + 6.25 * h - 5 * a + (p.sex === 'M' ? 5 : -161);
}
function rmrMin(){
  const p = S.profile || {}; const w = curWeight(); if(!w) return null;
  const b = bmrOf({...p, weight:w}); return b ? b / 1440 : 0.0175 * w * 0.9;
}
/* tempo stimato di ogni esercizio con i pesi (secondi): serie da 40 s + recuperi + 1 minuto per prepararsi */
const estSec = e => { const n = (e.sets || []).filter(s => num(s.reps)).length; return n ? n * 40 + Math.max(0, n - 1) * (e.rest || 90) + 60 : 0; };
function strengthPlan(w){
  const exs = (w.exercises || []).filter(e => !isCardio(e));
  const est = exs.map(estSec); const tot = est.reduce((a, b) => a + b, 0);
  const times = [];
  exs.forEach(e => (e.sets || []).forEach(s => { if(s.done && s.doneAt) times.push(s.doneAt); }));
  times.sort((a, b) => a - b);
  let scale = 1;
  if(times.length >= 2 && tot){
    const span = (times[times.length - 1] - times[0]) / 1000 + 60;
    if(span >= 300 && span < 4 * 3600) scale = span / tot;
  }
  return exs.map((e, i) => ({e, min: est[i] * scale / 60}));
}
const cardioMin = e => (e.sets || []).reduce((a, s) => a + (num(s.min) || 0), 0);
function durationMin(w){
  const st = strengthPlan(w).reduce((a, x) => a + x.min, 0);
  const cd = (w.exercises || []).filter(isCardio).reduce((a, e) => a + cardioMin(e), 0);
  return Math.round(st + cd);
}
/* calorie attive (solo quelle in più rispetto a stare fermo), arrotondate per difetto */
function cardioRowKcal(ex, row){
  const min = num(row.min); const kg = curWeight(); if(!min || !kg) return 0;
  if(ex && (ex.ctype === 'walk' || ex.ctype === 'run')){
    const kmh = Math.max(0, num(row.speed) || 0), g = Math.max(0, Math.min(40, num(row.incline) || 0)) / 100, v = kmh * 1000 / 60;
    const vo2 = kmh >= 7 ? 0.2 * v + 0.9 * v * g : 0.1 * v + 1.8 * v * g;   // equazioni ACSM, senza la quota a riposo
    return vo2 * kg * 0.005 * min;
  }
  const mets = (ex && ex.mets) || {bassa:4, media:5, alta:7};
  const met = mets[row.lvl] || mets.media;
  return Math.max(0, met - 1) * rmrMin() * min;
}
function exerciseKcal(w, e, planMin){
  const ex = getEx(e.exId); const r = rmrMin(); if(!r) return 0;
  if(isCardio(e)) return (e.sets || []).reduce((a, s) => a + cardioRowKcal(ex, s), 0);
  const met = (ex && ex.met) || 3.5;
  return Math.max(0, met - 1) * r * (planMin || 0);
}
function kcalOf(w){
  if(!rmrMin()) return null;
  let tot = 0;
  strengthPlan(w).forEach(x => { tot += exerciseKcal(w, x.e, x.min); });

function weekStats(offset){
  const r = weekRange(offset), rp = weekRange(offset - 1);

  const vol = ws.reduce((a, w) => a + summary(w).vol, 0);
  const prevVol = [...S.workouts.values()].filter(w => inRange(w, rp)).reduce((a, w) => a + summary(w).vol, 0);
  const kcal = rmrMin() ? ws.reduce((a, w) => a + (kcalOf(w) || 0), 0) : null;

  else if(!prevVol) trend = {kind:'su', txt:'nuovo'};
  else { const p = (vol - prevVol) / prevVol * 100; trend = {kind: Math.abs(p) <= 3 ? 'pari' : p > 0 ? 'su' : 'giu', txt:(p > 0 ? '+' : p < 0 ? '−' : '') + Math.abs(Math.round(p)) + '%'}; }

}

/* ---------- grafico dei progressi (un solo asse, una serie) ---------- */
function niceRange(lo, hi){
  if(lo === hi){ const d = Math.max(1, Math.abs(lo) * 0.1); lo -= d; hi += d; }
  const span = hi - lo, raw = span / 3, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || raw;
  const a = Math.max(0, Math.floor(lo / step) * step), b = Math.ceil(hi / step) * step;
  const ticks = []; for(let v = a; v <= b + 1e-9; v += step) ticks.push(+v.toFixed(2));
  return {a, b, ticks};
}
/* pts: [{date, y, label, caption}] */
function chartHTML(allPts, sel, aria){
  const pts = allPts.slice(-10);
  if(!pts.length) return `<p class="small muted" style="padding:8px 4px">Nessun dato ancora: registra questo esercizio in un allenamento e qui vedrai i tuoi progressi.</p>`;
  const W = 326, H = 180, X0 = 40, X1 = 312, YT = 22, YB = 148;
  const ys = pts.map(p => p.y); const {a, b, ticks} = niceRange(Math.min(...ys), Math.max(...ys));
  const X = i => pts.length === 1 ? (X0 + X1) / 2 : X0 + i * (X1 - X0) / (pts.length - 1);
  const Y = v => YB - (v - a) / (b - a) * (YB - YT);
  const selI = sel == null || sel >= pts.length ? pts.length - 1 : sel;
  let g = '';
  ticks.forEach(t => { g += `<line x1="${X0}" y1="${Y(t).toFixed(1)}" x2="${X1}" y2="${Y(t).toFixed(1)}" stroke="#E3EFE7"/><text x="${X0 - 8}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#4F6B5A">${fmtKg(t)}</text>`; });
  const every = Math.ceil(pts.length / 6);
  pts.forEach((p, i) => { if(i % every === 0 || i === pts.length - 1) g += `<text x="${X(i).toFixed(1)}" y="170" text-anchor="middle" font-size="11" fill="#4F6B5A">${fmtDM(p.date)}</text>`; });
  const line = pts.map((p, i) => `${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  if(pts.length > 1) g += `<polygon points="${X0},${YB} ${line} ${X(pts.length - 1).toFixed(1)},${YB}" fill="#31DA62" opacity="0.12"/><polyline points="${line}" fill="none" stroke="#0C7830" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p, i) => {
    const x = X(i).toFixed(1), y = Y(p.y).toFixed(1);
    if(i === selI) g += `<circle cx="${x}" cy="${y}" r="10" fill="#31DA62" opacity="0.25"/><circle cx="${x}" cy="${y}" r="5.5" fill="#31DA62" stroke="#0C7830" stroke-width="2.5"/>`;
    else g += `<circle cx="${x}" cy="${y}" r="4.5" fill="#FFFFFF" stroke="#0C7830" stroke-width="2"/>`;
    g += `<circle class="hit" cx="${x}" cy="${y}" r="16" fill="transparent" data-action="chartPt" data-i="${i}"><title>${esc(fmtShort(p.date))}: ${esc(p.label)}</title></circle>`;
  });
  const sp = pts[selI], sx = X(selI), sy = Y(sp.y);
  const anchor = sx > W - 90 ? 'end' : sx < 90 ? 'start' : 'middle';
  const lx = anchor === 'end' ? sx - 10 : anchor === 'start' ? sx + 10 : sx;
  g += `<text x="${lx.toFixed(1)}" y="${Math.max(12, sy - 14).toFixed(1)}" text-anchor="${anchor}" font-size="12" font-weight="700" fill="#101814">${esc(sp.label)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}: da ${esc(pts[0].label)} a ${esc(pts[pts.length - 1].label)} in ${pts.length} allenamenti" font-family="Figtree, sans-serif">${g}</svg>
    <p class="small muted" style="margin:0;padding:0 4px">${esc(fmtShort(sp.date))}: ${esc(sp.caption)}. Tocca un punto per vedere gli altri.</p>`;
}
function chartFor(id){
  const ex = getEx(id);
  if(ex && ex.kind === 'cardio'){
    const km = S.chartMode === 'km' && (ex.ctype === 'walk' || ex.ctype === 'run');
    const pts = cardioSessionsOf(id).map(s => ({date:s.date, y: km ? Math.round(s.km * 10) / 10 : s.min,
      label: km ? `${fmtKg(Math.round(s.km * 10) / 10)} km` : `${fmtKg(s.min)} min`, caption: cardioText(ex, s.sets)}));
    return chartHTML(pts, S.chartSel, km ? 'Andamento della distanza' : 'Andamento dei minuti');
  }
  const reps = S.chartMode === 'reps';
  const pts = sessionsOf(id).map(s => ({date:s.date, y: reps ? s.maxReps : s.best.k,
    label: reps ? `${s.maxReps} rip` : `${fmtKg(s.best.k)} kg × ${s.best.r}`,
    caption: `serie migliore ${fmtKg(s.best.k)} kg × ${s.best.r}${reps ? ` · massimo ${s.maxReps} ripetizioni` : ''}`}));

/* ---------- salvataggio nell'account (dentro Claude) ---------- */
const LS_KEY = 'limone-gym-v1';
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; } }
function lsWrite(d){ try{ localStorage.setItem(LS_KEY, JSON.stringify(d)); }catch(e){ toast('Non riesco a salvare su questo dispositivo.'); } }
const pending = [];
const writeQ = new Map();
function persist(col, id, data){
  if(S.mode === 'loading'){ pending.push([col, id, data]); return; }
  if(S.mode === 'local'){
    const all = lsRead(); all[col] = all[col] || {};
    if(data) all[col][id] = data; else delete all[col][id];
    lsWrite(all); return;
  }
  const key = col + '/' + id;
  if(navigator.onLine === false){ qAdd(key, data); return; }
  const e = writeQ.get(key) || {busy:false, has:false, data:null};
  e.has = true; e.data = data; writeQ.set(key, e);
  if(!e.busy) flush(key);
}
async function flush(key){
  const e = writeQ.get(key); if(!e) return;
  if(!e.has){ writeQ.delete(key); return; }
  e.busy = true; const data = e.data; e.has = false;
  const run = () => data ? S.db.doc(key).set(data) : S.db.doc(key).delete();
  try{ await run(); qDone(key); }
  catch(err){
    const code = err && err.code;
    if(!code || code === 'unavailable' || code === 'resource_exhausted'){
      await new Promise(r => setTimeout(r, 700 + Math.random() * 900));
      try{ await run(); qDone(key); }catch(e2){ qAdd(key, data); }
    } else if(code === 'quota_exceeded') toast('Spazio pieno: elimina qualche allenamento vecchio.');
    else toast('Salvataggio non riuscito. Riprova tra poco.');
  }
  e.busy = false;
  if(e.has) flush(key); else writeQ.delete(key);
}
function loadLocal(){
  const all = lsRead();
  S.workouts = new Map(Object.entries(all.workouts || {}).map(([k, v]) => [k, {...v, id:k}]));
  S.custom = new Map(Object.entries(all.exercises || {}).map(([k, v]) => [k, {...v, id:k}]));
  S.profile = (all.profile && all.profile.main) || null;

  S.food = mapOf(all.food); S.body = mapOf(all.body); S.foods = mapOf(all.foods); S.meals = mapOf(all.meals); S.checkins = mapOf(all.checkins);
  S.nutri = (all.nutri && all.nutri.settings) || null; S.got = {food:true, body:true, nutri:true, checkins:true};

}
async function initStore(){

  use('sample').then(fn => { S.sample = typeof fn === 'function' ? fn : null; if(S.sample) refresh(); });
  const db = await use('db');
  if(db){

    let gotW = false, gotP = false;
    const ready = () => { if(gotW && gotP && !S.loaded){ S.loaded = true; } refresh(); };
    const toMap = (col, snap) => { const m = new Map(); snap.docs.forEach(d => { if(d.exists) m.set(d.id, {...d.data(), id:d.id}); }); return overlayQ(col, m); };
    const docQ = (key, d, fallback) => { const q = OQ[key]; return q ? (q.data ? {...q.data} : null) : d.exists ? {...d.data()} : fallback; };
    const lost = () => toast('Connessione ai dati interrotta. Ricarica la pagina.');
    db.collection('workouts').onSnapshot(snap => { S.workouts = toMap('workouts', snap); gotW = true; ready(); }, lost);
    db.collection('exercises').onSnapshot(snap => { S.custom = toMap('exercises', snap); refresh(); }, () => {});
    db.doc('profile/main').onSnapshot(d => { S.profile = docQ('profile/main', d, S.profile || null); gotP = true; ready(); }, () => { gotP = true; ready(); });
    db.collection('food').where('date', '>=', addDays(todayISO(), -FOOD_DAYS)).onSnapshot(snap => {
      const m = toMap('food', snap); S.foodOld.forEach((v, k) => { if(!m.has(k)) m.set(k, v); }); S.food = m; S.got.food = true; refresh();
    }, () => { S.got.food = true; lost(); });
    db.collection('body').onSnapshot(snap => { S.body = toMap('body', snap); S.got.body = true; refresh(); }, () => { S.got.body = true; lost(); });
    db.collection('foods').onSnapshot(snap => { S.foods = toMap('foods', snap); refresh(); }, () => {});
    db.collection('meals').onSnapshot(snap => { S.meals = toMap('meals', snap); refresh(); }, () => {});
    db.collection('checkins').onSnapshot(snap => { S.checkins = toMap('checkins', snap); S.got.checkins = true; refresh(); }, () => { S.got.checkins = true; refresh(); });
    db.doc('nutri/settings').onSnapshot(d => { S.nutri = docQ('nutri/settings', d, null); S.got.nutri = true; refresh(); }, () => { S.got.nutri = true; refresh(); });
    use('assets').then(a => { S.assets = a; });

function exDetailHTML(id, fallbackName, inSheet){
  const ex = getEx(id); const name = ex ? ex.name : (fallbackName || 'Esercizio');
  const cardio = !!(ex && ex.kind === 'cardio');
  const isCustom = ex && !ex.A;
  let h = `<div class="exhero">${thumb(id, true)}<div style="display:flex;flex-direction:column;gap:3px;min-width:0">
      <span class="label">${esc(ex ? ex.g : '')}</span><h2>${esc(name)}</h2>${ex && ex.m ? `<span class="small muted">${esc(ex.m)}</span>` : ''}</div></div>`;
  const modes = cardio ? [['min', 'Minuti']].concat(ex.ctype === 'walk' || ex.ctype === 'run' ? [['km', 'Km']] : []) : [['kg', 'Kg'], ['reps', 'Ripetizioni']];
  h += `<div class="card" style="padding:14px 12px 12px;display:flex;flex-direction:column;gap:10px">
      <div class="spread" style="padding:0 4px;align-items:flex-start"><div><div style="font-weight:700">I tuoi progressi</div><div class="small muted">${cardio ? 'Totale di ogni allenamento' : 'Serie migliore di ogni allenamento'}</div></div>
        ${modes.length > 1 ? `<div class="seg" role="group" aria-label="Cosa mostrare">${modes.map(([m, l]) => `<button class="${S.chartMode === m ? 'on' : ''}" data-action="chartMode" data-m="${m}" aria-pressed="${S.chartMode === m}">${l}</button>`).join('')}</div>` : ''}</div>
      <div id="chartBox">${chartFor(id)}</div>
    </div>`;
  if(cardio){
    const cs = cardioSessionsOf(id);
    if(cs.length){
      const totMin = cs.reduce((a, s) => a + s.min, 0), totKm = cs.reduce((a, s) => a + s.km, 0);
      const walkRun = ex.ctype === 'walk' || ex.ctype === 'run';
      h += `<div class="stats">
        <div class="stat"><b class="num">${fmtInt(totMin)}</b><span>minuti in totale</span></div>
        <div class="stat"><b class="num">${walkRun ? fmtKg(Math.round(totKm * 10) / 10) : fmtInt(Math.max(...cs.map(s => s.min)))}</b><span>${walkRun ? 'km in totale' : 'minuti record'}</span></div>
        <div class="stat"><b class="num">${cs.length}</b><span>allenamenti</span></div>
      </div>`;
      h += `<div class="section" style="margin-top:4px"><span class="label">Storico</span><div class="hist">${cs.slice().reverse().slice(0, 8).map(s => `<div><span class="muted">${esc(fmtShort(s.date))}</span><span class="num">${esc(cardioText(ex, s.sets))}</span></div>`).join('')}</div></div>`;
    }
  } else {
    const sess = sessionsOf(id);
    if(sess.length){
      const record = Math.max(...sess.map(s => s.best.k));
      const gain = sess.length > 1 ? sess[sess.length - 1].best.k - sess[0].best.k : null;
      h += `<div class="stats">
        <div class="stat"><b class="num">${fmtKg(record)}</b><span>record (kg)</span></div>
        <div class="stat"><div class="trend">${arrowHTML(gain == null || gain === 0 ? 'pari' : gain > 0 ? 'su' : 'giu', 14)}<b class="num">${gain == null ? '—' : fmtKg(Math.abs(gain))}</b></div><span>kg ${gain != null && gain < 0 ? 'persi' : 'guadagnati'}</span></div>
        <div class="stat"><b class="num">${sess.length}</b><span>allenamenti</span></div>
      </div>`;
      h += `<div class="section" style="margin-top:4px"><span class="label">Storico</span><div class="hist">${sess.slice().reverse().slice(0, 8).map(s => `<div><span class="muted">${esc(fmtShort(s.date))}</span><span class="num">${esc(setsText(s.sets))}</span></div>`).join('')}</div></div>`;
    }
  }
  if(ex && ex.cues && ex.cues.length) h += `<div class="section" style="margin-top:4px"><span class="label">Come si fa</span><ol class="cues">${ex.cues.map(c => `<li>${esc(c)}</li>`).join('')}</ol></div>`;
  if(!ex) h += `<p class="note">Questo esercizio è stato eliminato dalla libreria.</p>`;
  if(isCustom){
    if(photoAvailable()) h += `<label class="btn" for="exPhoto">${photoSrc(ex) ? 'Cambia foto' : 'Carica una foto'}</label><input type="file" id="exPhoto" accept="image/*" data-id="${esc(id)}" hidden>`;
    h += S.confirmCustom
      ? `<div class="confirm"><span>Eliminare l'esercizio dalla libreria? Gli allenamenti passati restano.</span><div class="row"><button class="btn" data-action="delCustomNo" data-id="${esc(id)}">Annulla</button><button class="btn-danger solid" data-action="delCustomYes" data-id="${esc(id)}">Elimina</button></div></div>`
      : `<button class="btn-danger" data-action="delCustom" data-id="${esc(id)}">Elimina esercizio</button>`;
  }
  return h;
}

/* ---------- salvataggio dell'allenamento aperto ---------- */
let saveT = null;
function scheduleSave(){ S.dirty = true; clearTimeout(saveT); saveT = setTimeout(saveDraft, 600); }
function saveDraft(){
  clearTimeout(saveT); saveT = null;
  const w = S.draft; if(!w || !S.dirty) return; S.dirty = false;
  if(!(w.exercises || []).length && !S.workouts.has(w.id)) return;
  w.updatedAt = Date.now();
  const data = clone(w); delete data.id;
  S.workouts.set(w.id, {...data, id:w.id});
  persist('workouts', w.id, data);
}
function openEditor(draft){ S.draft = draft; S.editId = draft.id; S.dirty = false; S.confirmDel = false; render(); window.scrollTo(0, 0); }
function closeEditor(){
  saveDraft();
  const w = S.draft;
  if(w && !(w.exercises || []).length && S.workouts.has(w.id)){ S.workouts.delete(w.id); persist('workouts', w.id, null); }
  if(w) S.weekOffset = Math.min(0, offsetOfDate(w.date));
  S.draft = null; S.editId = null; S.tab = 'diario'; render(); window.scrollTo(0, 0);
}
const copyRow = r => { const o = {...r}; delete o.doneAt; o.done = false; return o; };
function addExercise(id){
  const ex = getEx(id); if(!ex) return;
  const prev = lastSession(id, S.draft.id, S.draft.date);
  if(ex.kind === 'cardio'){
    const sets = prev && prev.ex.sets.length ? prev.ex.sets.map(copyRow) : [{...ex.def, done:false}];
    S.draft.exercises.push({exId:id, name:ex.name, kind:'cardio', sets});
    scheduleSave(); return;
  }
  const sets = prev && prev.ex.sets.length ? prev.ex.sets.map(s => ({kg:s.kg, reps:s.reps, done:false})) : [0, 1, 2].map(() => ({kg:'', reps:'', done:false}));
  S.draft.exercises.push({exId:id, name:ex.name, rest:prev ? (prev.ex.rest ?? 90) : 90, sets});
  scheduleSave();
}

/* ---------- recupero ---------- */
const T = {end:0, int:null, label:''};
let AC = null, wake = null;
function unlockAudio(){ try{ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume(); }catch(e){} }
function beep(){
  if(!AC) return;
  try{ [0, .22, .44].forEach(t => { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'square'; o.frequency.value = t > .4 ? 1175 : 880;
    const t0 = AC.currentTime + t; g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.18, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + .16);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + .18); }); }catch(e){}
}
async function requestWake(){ try{ if(navigator.wakeLock && !wake) wake = await navigator.wakeLock.request('screen'); }catch(e){ wake = null; } }
function releaseWake(){ try{ if(wake) wake.release(); }catch(e){} wake = null; }
function placeTimer(){ const nav = $('#nav'); $('#timer').style.bottom = nav.hidden ? '0px' : nav.offsetHeight + 'px'; }
function startTimer(sec, label){
  if(!sec){ toast('Imposta prima il tempo di recupero.'); return; }
  unlockAudio(); requestWake();
  T.end = Date.now() + sec * 1000; T.label = label;
  const el = $('#timer'); el.hidden = false; el.classList.remove('ring'); placeTimer();
  clearInterval(T.int); T.int = setInterval(tick, 250); tick();
}
function tick(){
  const left = Math.max(0, Math.ceil((T.end - Date.now()) / 1000));
  $('#timerT').textContent = fmtRest(left);
  $('#timerL').textContent = left ? T.label : 'Recupero finito: vai con la prossima serie';
  if(!left){
    clearInterval(T.int); T.int = null; $('#timer').classList.add('ring'); beep(); releaseWake();
    setTimeout(() => { if(!T.int) $('#timer').hidden = true; }, 8000);
  }
}

function scrollToLastBlock(){ const b = document.querySelectorAll('.exblock'); if(b.length) b[b.length - 1].scrollIntoView({behavior:REDUCED ? 'auto' : 'smooth', block:'start'}); }
function openWeekPicker(){
  const dates = [...S.workouts.values()].map(w => w.date).filter(Boolean).sort();
  const oldest = dates.length ? Math.max(-104, Math.min(0, offsetOfDate(dates[0]))) : 0;
  let rows = '';
  for(let o = 0; o >= oldest; o--){
    const st = weekStats(o);
    rows += `<button class="weekrow ${o === S.weekOffset ? 'on' : ''}" data-action="pickWeek" data-o="${o}">
      <div style="flex:1"><div style="font-weight:700">${esc(weekLabel(st.r))}${o === 0 ? ' · questa settimana' : ''}</div>
      <div class="small muted">${st.ws.length} ${st.ws.length === 1 ? 'allenamento' : 'allenamenti'}${st.kcal ? ` · ${fmtInt(st.kcal)} kcal` : ''}</div></div>
      ${st.ws.length ? `<div class="trend">${arrowHTML(st.trend.kind)}<span class="small num">${esc(st.trend.txt)}</span></div>` : ''}</button>`;
  }
  openSheet('weeks', `<div class="spread"><h2>Il tuo storico</h2><button class="btn-ghost" data-action="closeSheet">Chiudi</button></div><div style="display:flex;flex-direction:column;gap:8px">${rows}</div>`);
}
function openProfile(){
  const p = S.profile || {};
  openSheet('profile', `<h2>Il tuo profilo</h2>
    <div class="field"><label class="label" for="pName">Nome</label><input class="input" id="pName" value="${esc(p.name || '')}" maxlength="24" autocomplete="off"></div>
    ${profileFields(p, 'p')}
    <p class="small muted" style="margin:0">Servono a stimare le calorie attive. Senza sesso, età e altezza la stima usa solo il peso.</p>
    ${S.mode === 'local' ? `<button class="btn" data-action="exportOpen">Esporta i dati di questo telefono</button>` : S.mode === 'cloud' ? `<button class="btn" data-action="importOpen">Importa dati da un'altra copia</button>` : ''}
    <div class="row"><button class="btn-go" data-action="saveProfile" style="flex:1">Salva</button><button class="btn" data-action="closeSheet">Annulla</button></div>`);
}
function readWeight(v){ const n = num(v); return n && n > 25 && n < 300 ? n : null; }
function readProfile(pre, name){
  const sx = document.querySelector(`input[name="${pre}Sex"]:checked`);
  const age = num($('#' + pre + 'Age').value), h = num($('#' + pre + 'Height').value);
  return {name, sex: sx ? sx.value : null, age: age && age >= 12 && age <= 100 ? Math.round(age) : null,
    height: h && h >= 120 && h <= 230 ? Math.round(h) : null, weight: readWeight($('#' + pre + 'Weight').value)};
}

  startRest: el => { const e = exAt(el); startTimer(e.rest || 0, e.name); },

    const e = exAt(el); const s = e.sets[+el.dataset.k]; s.done = !s.done;
    if(s.done) s.doneAt = Date.now(); else delete s.doneAt;
    el.closest('.setrow').classList.toggle('done', s.done); el.setAttribute('aria-pressed', s.done ? 'true' : 'false');

    scheduleSave();
  },
  addSet: el => { const e = exAt(el); const l = e.sets[e.sets.length - 1]; const ex = getEx(e.exId); e.sets.push(l ? copyRow(l) : isCardio(e) ? {...((ex && ex.def) || {min:''}), done:false} : {kg:'', reps:'', done:false}); scheduleSave(); render(); },
  delSet: el => { exAt(el).sets.splice(+el.dataset.k, 1); scheduleSave(); render(); },

  showEx: el => openExSheet(el.dataset.id, el.dataset.name),

  exBack: () => { S.exPage = null; S.confirmCustom = false; render(); },

  closeSheet: () => closeSheet(),
  libFilter: el => { S.libG = el.dataset.g; render(); },
  pickFilter: el => { S.pickG = el.dataset.g; refreshPickList(); },
  newCustom: () => openCustomForm(),
  saveCustom: el => saveCustom(el),

  delCustomNo: el => { S.confirmCustom = false; S.sheet === 'ex' ? openExSheet(el.dataset.id) : render(); },
  delCustomYes: el => {
    const id = el.dataset.id; deletePhoto(S.custom.get(id));
    S.custom.delete(id); persist('exercises', id, null); closeSheet(); S.exPage = null; render(); toast('Esercizio eliminato.');
  },
  timerAdd: el => { if(!T.int){ startTimer(Math.max(15, +el.dataset.s), T.label || 'Recupero'); return; } T.end = Math.max(Date.now() + 1000, T.end + (+el.dataset.s) * 1000); tick(); },
  timerStop: () => { clearInterval(T.int); T.int = null; $('#timer').hidden = true; releaseWake(); },
  ...EXTRA_ACTIONS,
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-action]'); if(!el) return;
  const fn = A[el.dataset.action]; if(fn){ ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('submit', ev => {
  if(ev.target.id !== 'welcomeForm') return;
  ev.preventDefault();
  const name = $('#wName').value.trim(); if(!name){ toast('Scrivi il tuo nome.'); $('#wName').focus(); return; }
  saveProfile(readProfile('w', name)); S.tab = 'diario'; render(); window.scrollTo(0, 0);
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if(el.id === 'pickQ'){ S.pickQ = el.value; refreshPickList(); return; }
  if(nutriInput(el) || migInput(el)) return;
  if(!S.draft) return;
  if(el.dataset.field){ S.draft[el.dataset.field] = el.value; scheduleSave(); return; }
  if(el.dataset.set){ S.draft.exercises[+el.dataset.i].sets[+el.dataset.k][el.dataset.set] = el.value; scheduleSave(); updateSum(); }
});
document.addEventListener('change', async ev => {
  const el = ev.target;
  if(await onExtraChange(el)) return;
  if(el.id === 'wdate' && S.draft){ S.draft.date = el.value || todayISO(); scheduleSave(); return; }
  if(el.id === 'exPhoto' && el.files[0]){
    const id = el.dataset.id; const ex = S.custom.get(id); if(!ex) return;
    toast('Carico la foto…');
    const ref = await uploadPhoto(el.files[0]); if(!ref) return;
    deletePhoto(ex);
    const data = {...ex}; delete data.id; delete data.photo; delete data.imageId; Object.assign(data, ref);
    S.custom.set(id, {...data, id}); persist('exercises', id, data);
    S.sheet === 'ex' ? openExSheet(id) : render(); toast('Foto salvata.');
  }
});
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape' && S.sheet) closeSheet();
  if(ev.key === 'Enter' && ev.target.matches('.setrow input')) ev.target.blur();
});
document.addEventListener('visibilitychange', () => { if(document.hidden) saveDraft(); else if(T.int) tick(); });

function bodyList(){
  if(S._bodyCache && S._bodyCache.src === S.body) return S._bodyCache.list;
  const out = [];
  S.body.forEach((doc, month) => { const d = (doc && doc.d) || {}; for(const day in d){ const e = d[day] || {}; const kg = num(e.kg), waist = num(e.waist); if(kg || waist) out.push({date:`${month}-${day}`, kg, waist}); } });
  out.sort((a, b) => a.date.localeCompare(b.date));
  S._bodyCache = {src:S.body, list:out}; return out;
}
const weighList = () => bodyList().filter(e => e.kg);
function avgAt(date){ const from = addDays(date, -6); const r = weighList().filter(e => e.date >= from && e.date <= date); return r.length ? r.reduce((a, e) => a + e.kg, 0) / r.length : null; }
function curWeight(){ const w = weighList(); if(w.length) return avgAt(w[w.length - 1].date); return num(S.profile && S.profile.weight); }
function setBody(date, patch){
  const m = date.slice(0, 7), dd = date.slice(8);
  const doc = clone(S.body.get(m) || {d:{}}); delete doc.id; doc.d = doc.d || {};
  const e = {...(doc.d[dd] || {}), ...patch}; Object.keys(e).forEach(k => { if(e[k] == null || e[k] === '') delete e[k]; });
  if(Object.keys(e).length) doc.d[dd] = e; else delete doc.d[dd];
  S.body = new Map(S.body);
  if(!Object.keys(doc.d).length){ S.body.delete(m); persist('body', m, null); return; }
  doc.month = m; S.body.set(m, {...doc, id:m}); persist('body', m, doc);
}
/* ritmo in % del peso a settimana, dalla retta delle pesate degli ultimi 21 giorni */
function slopeRate(endISO){
  const from = addDays(endISO, -20);
  const pts = weighList().filter(e => e.date >= from && e.date <= endISO).map(e => [daysBetween(from, e.date), e.kg]);
  if(pts.length < 8 || pts[pts.length - 1][0] - pts[0][0] < 10) return null;
  const n = pts.length, mx = pts.reduce((a, p) => a + p[0], 0) / n, my = pts.reduce((a, p) => a + p[1], 0) / n;
  let sxy = 0, sxx = 0; pts.forEach(([x, y]) => { sxy += (x - mx) * (y - my); sxx += (x - mx) * (x - mx); });
  return sxx ? (sxy / sxx) * 7 / my * 100 : null;
}
function weekAvgKg(r){ const w = weighList().filter(e => e.date >= r.start && e.date <= r.end); return {n:w.length, kg:w.length ? w.reduce((a, e) => a + e.kg, 0) / w.length : null}; }
function rateNow(){
  const s = slopeRate(todayISO()); if(s != null) return s;
  const a = weekAvgKg(weekRange(0)), b = weekAvgKg(weekRange(-1));
  if(a.n >= 3 && b.n >= 3) return (a.kg - b.kg) / b.kg * 100;
  return null;
}
const level = () => LEVELS[(S.nutri && S.nutri.level) || 'anno'] || LEVELS.anno;
const fmtRate = (rate, kg) => { const k = rate / 100 * kg; return `${k >= 0 ? '+' : '−'}${fmtKg(Math.abs(r2(k)))} kg a settimana`; };
function rateStatus(rate){ if(rate == null) return null; const L = level(); return rate < L.lo ? {c:'warn', t:'troppo lento'} : rate > L.hi ? {c:'warn', t:'troppo veloce'} : {c:'ok', t:'ritmo giusto'}; }
function waistTrend(endISO){
  const from = addDays(endISO, -42); const ws = bodyList().filter(e => e.waist && e.date >= from && e.date <= endISO);
  if(ws.length < 2) return null; const a = ws[0], b = ws[ws.length - 1]; const days = daysBetween(a.date, b.date);
  if(days < 14) return null; const d = b.waist - a.waist; return {d, days, perMonth:d / days * 28};
}

const dayOf = date => S.food.get(date) || null;
const itemsOf = date => (dayOf(date) || {}).items || [];
const itemNut = it => { const m = (num(it.g) || 0) / 100; return {k:(it.k || 0) * m, p:(it.p || 0) * m, c:(it.c || 0) * m, f:(it.f || 0) * m}; };
function sumItems(items){ const t = {k:0, p:0, c:0, f:0}; (items || []).forEach(it => { const n = itemNut(it); t.k += n.k; t.p += n.p; t.c += n.c; t.f += n.f; }); return t; }
function saveDay(date, day){
  const items = day.items || [];
  S.food = new Map(S.food);
  if(!items.length){ S.food.delete(date); S.foodOld.delete(date); persist('food', date, null); return; }
  const data = {date, items, closed:!!day.closed, updatedAt:Date.now()};
  S.food.set(date, {...data, id:date}); if(date < addDays(todayISO(), -FOOD_DAYS)) S.foodOld.set(date, {...data, id:date});

}

function loadFoodDay(date){

}
function recentFoods(){

  [...S.food.keys()].sort().reverse().slice(0, 30).forEach(d => itemsOf(d).slice().reverse().forEach(it => {
    if(!it.fid || seen.has(it.fid)) return; const f = getFood(it.fid); if(f) seen.set(it.fid, {f, g:num(it.g)});
  }));

function searchFoods(q){
  const toks = q.split(' ').filter(Boolean); if(!toks.length) return [];
  const rec = new Set(recentFoods().map(r => r.f.id));
  return [...S.foods.values(), ...FOODS].map(f => {
    if(!f._s) f._s = norm(`${f.name} ${f.st || ''} ${f.al || ''} ${FOOD_CATS[f.cat] || ''}`);
    const words = f._s.split(' ');
    if(!toks.every(t => words.some(w => w.startsWith(t)))) return null;
    const n = norm(f.name); let sc = 0;
    if(n.startsWith(q)) sc += 4; if(n.split(' ').some(w => w.startsWith(toks[0]))) sc += 2; if(rec.has(f.id)) sc += 2; if(!f.db) sc += 1;
    return {f, sc};

}

/* ---------- obiettivi ---------- */
function planFor(p, lv, act, w){
  const b = bmrOf({...p, weight:w}); if(!b || !w) return null;
  const L = LEVELS[lv] || LEVELS.anno, A = ACTS[act] || ACTS.seduto;
  const tdee = round50(b * A.f); const kcal = round50(tdee + w * L.t / 100 * KCAL_KG / 7);
  return {tdee, kcal, ...macrosFor(kcal, w)};
}
function macrosFor(kcal, w){ const p = round5(2 * w), f = round5(0.9 * w); return {p, f, c:Math.max(0, round5((kcal - 4 * p - 9 * f) / 4))}; }
function targets(){ const n = S.nutri; if(!n || !n.kcal) return null; const w = curWeight() || 70; return {kcal:n.kcal, w, ...macrosFor(n.kcal, w)}; }
function targetAt(date){
  const h = ((S.nutri && S.nutri.hist) || []).filter(x => x.date <= date).sort((a, b) => a.date.localeCompare(b.date));
  return h.length ? h[h.length - 1].kcal : S.nutri && S.nutri.kcal;
}
function judge(t, T){
  const r = t.k / T.kcal;
  const ks = Math.abs(r - 1) <= .08 ? 'ok' : Math.abs(r - 1) <= .15 ? 'warn' : 'bad';
  const ps = t.p >= T.p * .9 ? 'ok' : t.p >= T.p * .75 ? 'warn' : 'bad';
  const fs = t.f < .5 * T.w ? 'bad' : t.f < .7 * T.w ? 'warn' : (t.k > 0 && t.f * 9 > .4 * t.k) ? 'warn' : 'ok';
  return {ks, ps, fs, r};
}
const PTIPS = [['d-greco0', 170, '1 vasetto di yogurt greco 0%'], ['d-whey', 30, '1 misurino di whey'], ['d-pollo', 150, '150 g di petto di pollo'], ['d-tonno-nat', 112, '1 scatoletta grande di tonno']];
function proteinTip(){ return 'Idee per le proteine: ' + PTIPS.map(([id, g, l]) => `${l} (+${Math.round(getFood(id).p * g / 100)} g)`).join(', ') + '.'; }
function dayMsg(date){
  const T = targets(); if(!T) return null;
  const items = itemsOf(date); const today = todayISO();
  if(!items.length) return date === today ? null : {s:'', txt:'Niente registrato in questo giorno.'};
  const t = sumItems(items); const d = dayOf(date); const closed = !!(d && d.closed);
  if(date === today && !closed){
    const mk = T.kcal - t.k, mp = T.p - t.p; const bits = [];
    if(mk > 50) bits.push(`${fmtInt(mk)} kcal`); if(mp > 3) bits.push(`${fmtInt(mp)} g di proteine`);
    if(!bits.length) return t.k > T.kcal * 1.08 ? {s:'warn', txt:`Sei oltre l'obiettivo di ${fmtInt(-mk)} kcal: per oggi basta così.`} : {s:'ok', txt:'Obiettivi di oggi raggiunti. Stasera chiudi la giornata.'};
    return {s:'', txt:`Ti mancano ${bits.join(' e ')}.`, tip: mp > 20 ? proteinTip() : ''};
  }
  const j = judge(t, T); const all = [j.ks, j.ps, j.fs];
  const worst = all.includes('bad') ? 'bad' : all.includes('warn') ? 'warn' : 'ok';
  const parts = [];
  if(j.ks !== 'ok') parts.push(j.r < 1 ? `calorie basse (${fmtInt(t.k)} su ${fmtInt(T.kcal)})` : `calorie alte (${fmtInt(t.k)} su ${fmtInt(T.kcal)})`);
  if(j.ps !== 'ok') parts.push(`proteine basse (${fmtInt(t.p)} g su ${T.p})`);
  if(j.fs !== 'ok') parts.push(t.f < .7 * T.w ? `grassi troppo bassi (${fmtInt(t.f)} g)` : `tanti grassi (${fmtInt(t.f)} g): meglio spostare un po' di calorie sui carboidrati`);
  const txt = parts.length ? cap(parts.join(', ')) + '.' : 'Giornata centrata: calorie e proteine a posto.';
  return {s:closed ? worst : 'warn', txt: closed ? txt : 'Giornata non chiusa: non conta nel check-in. ' + txt};
}

    if(!w.date) return; const slot = w.date >= aFrom && w.date <= endISO ? 0 : w.date >= bFrom && w.date <= bTo ? 1 : -1; if(slot < 0) return;
    (w.exercises || []).forEach(e => { if(isCardio(e)) return; (e.sets || []).forEach(s => { const k = num(s.kg), r = num(s.reps); if(!k || !r || r > 20) return;
      const cur = best.get(e.exId) || [0, 0]; cur[slot] = Math.max(cur[slot], e1rm(k, r)); best.set(e.exId, cur); }); });
  });
  let up = 0, flat = 0, down = 0;
  best.forEach(([a, b]) => { if(!a || !b) return; const d = (a - b) / b; if(d > .02) up++; else if(d < -.02) down++; else flat++; });

}

/* ---------- check-in settimanale ---------- */
function weekNut(r){
  const closed = r.days.filter(d => { const x = dayOf(d); return x && x.closed && (x.items || []).length; });
  const tots = closed.map(d => sumItems(itemsOf(d)));
  const avg = k => tots.length ? tots.reduce((a, t) => a + t[k], 0) / tots.length : null;
  const w = weekAvgKg(r);
  return {closed:closed.length, kcal:avg('k'), p:avg('p'), weigh:w.n, kg:w.kg};
}
const dataReady = () => S.got.food && S.got.body && S.got.nutri && S.got.checkins;
function pendingCheckin(){
  const n = S.nutri; if(!n || !n.start || !dataReady()) return null;
  const r = weekRange(-1);
  if(n.start > r.end || S.checkins.has(r.start)) return null;
  return r;
}
function evalWeek(offset){
  const n = S.nutri; if(!n) return null;
  const r = weekRange(offset), cur = weekNut(r), prev = weekNut(weekRange(offset - 1));
  const T = targetAt(r.end) || n.kcal; const L = LEVELS[n.level] || LEVELS.anno;
  const out = {week:r.start, end:r.end, closed:cur.closed, weigh:cur.weigh, kg:cur.kg, prevKg:prev.weigh >= 4 ? prev.kg : null,
    avgKcal:cur.kcal, avgP:cur.p, target:T, newTarget:T, lines:[], status:'ok', rate:null, tdee:null, msg:''};
  const miss = [];
  if(cur.weigh < 4) miss.push(`${cur.weigh === 1 ? 'solo 1 pesata' : `solo ${cur.weigh} pesate`} (minimo 4)`);
  if(cur.closed < 5) miss.push(`${cur.closed === 1 ? 'solo 1 giornata chiusa' : `solo ${cur.closed} giornate chiuse`} (minimo 5)`);
  if(miss.length){ out.status = 'incompleta'; out.msg = `Settimana non valida: ${miss.join(' e ')}. Il verdetto salta e l'obiettivo resta ${fmtInt(T)} kcal.`; return out; }
  let rate = slopeRate(r.end);
  if(rate == null && out.prevKg) rate = (cur.kg - out.prevKg) / out.prevKg * 100;
  out.rate = rate;
  const w = cur.kg, pT = round5(2 * w);
  if(cur.p != null && cur.p < pT * .9) out.lines.push(`Proteine medie ${fmtInt(cur.p)} g al giorno: l'obiettivo è ${pT} g. Mettine una fonte in ogni pasto.`);
  if(rate == null){ out.status = 'base'; out.msg = 'Prima settimana completa: da qui misuro il ritmo. Il primo verdetto arriva lunedì prossimo.'; return out; }
  out.tdee = Math.round(cur.kcal - rate / 100 * w * KCAL_KG / 7);
  const adh = cur.kcal / T;
  const need = cur.kcal + (L.t - rate) / 100 * w * KCAL_KG / 7;
  const clampD = d => Math.max(-150, Math.min(150, round50(d)));
  let delta = 0;
  if(adh < .92){ out.status = 'sotto'; out.msg = `Hai mangiato in media ${fmtInt(cur.kcal)} kcal, sotto l'obiettivo di ${fmtInt(T)}. Prima di cambiare i numeri, arriva all'obiettivo ogni giorno.`; }
  else if(rate > L.hi){
    out.status = 'veloce';
    if(adh > 1.08) out.msg = `Il peso sale troppo in fretta e hai mangiato più dell'obiettivo: torna a ${fmtInt(T)} kcal.`;
    else { delta = Math.min(-50, clampD(need - T)); out.msg = 'Il peso sale troppo in fretta: rischi di mettere più grasso che muscolo. Tolgo un po\' di calorie.'; }
  }
  else if(rate < L.lo){ out.status = 'lento'; delta = Math.max(50, clampD(need - T)); out.msg = 'Il peso sale troppo piano per costruire muscolo al massimo: servono più calorie.'; }
  else if(adh > 1.08){ out.status = 'ok'; delta = clampD(cur.kcal - T); out.msg = 'Ritmo giusto, ma hai mangiato più dell\'obiettivo: lo avvicino a quello che mangi davvero.'; }
  else { out.status = 'ok'; out.msg = 'Ritmo giusto: continua così.'; }
  const st = strengthTrend(r.end);
  if(st.n >= 2){
    out.lines.push(`Carichi, ultime 4 settimane contro le 4 prima: ${st.up} esercizi in salita, ${st.flat} stabili, ${st.down} in calo.`);
    if(rate >= L.lo && st.up * 2 < st.n) out.lines.push('Il peso sale ma i carichi quasi no: punta a progredire (più peso o più ripetizioni) e dormi bene, altrimenti rischi di mettere più grasso che muscolo.');
  }
  const wt = waistTrend(r.end);
  if(wt){
    const txt = `Vita ${wt.d >= 0 ? '+' : '−'}${fmtKg(Math.abs(r1(wt.d)))} cm in ${wt.days} giorni.`;
    if(wt.perMonth > 1.5 && delta > 0){ delta = 0; out.lines.push(txt + ' Sale in fretta: per ora non alzo le calorie.'); }
    else out.lines.push(wt.perMonth > 1.5 && rate > L.t ? txt + ' Sale in fretta insieme al peso: tienila d\'occhio.' : txt);
  }
  if(delta && n.start && daysBetween(n.start, r.end) < 13){ out.lines.push(`Il primo aggiustamento arriva dopo 2 settimane di dati: per ora l'obiettivo resta ${fmtInt(T)} kcal.`); delta = 0; }
  out.newTarget = T + delta;
  return out;
}
function applyCheckin(){
  const ev = evalWeek(-1); if(!ev) return;
  const rec = {...ev, at:Date.now()};
  S.checkins = new Map(S.checkins); S.checkins.set(ev.week, {...rec, id:ev.week}); persist('checkins', ev.week, rec);
  const n = clone(S.nutri);
  if(ev.tdee && ev.status !== 'incompleta' && ev.status !== 'sotto') n.tdee = round50(((n.tdee || ev.tdee) + ev.tdee) / 2);
  if(ev.newTarget !== ev.target){

function aiPrompt(text){
  const arch = [...FOODS, ...S.foods.values()].map(f => `${f.id}|${f.name}${f.st ? ' (' + f.st + ')' : ''}`).join('\n');
  return `Sei un nutrizionista sportivo italiano. Trasforma il testo dell'utente nell'elenco degli alimenti che ha mangiato, con i grammi.

Regole:
- Se un alimento corrisponde a una voce dell'ARCHIVIO, metti in "fid" l'id esatto e lascia null kcal, p, c, f.
- Se nell'archivio non c'è una voce adatta, metti "fid": null e scrivi i valori medi PER 100 g: kcal, p (proteine), c (carboidrati), f (grassi), riferiti allo stato indicato in "st" ("crudo", "cotto" o "").
- "g" = grammi (o ml) totali mangiati di quell'alimento. Converti le unità: 1 uovo = 55 g, 1 albume = 33 g, 1 cucchiaio d'olio = 10 g, 1 cucchiaino = 5 g, 1 fetta di pane = 30 g, 1 panino = 70 g, 1 banana = 120 g, 1 mela = 180 g, 1 vasetto di yogurt = 125 g (greco 170 g), 1 misurino di proteine = 30 g, 1 lattina = 330 g, 1 bicchiere = 200 g (vino 125 g), 1 tazza = 250 g.
- Pasta, riso, cereali e legumi secchi: se l'utente non dice "cotto", il peso è a crudo.
- Se manca la quantità, stima una porzione normale e metti "stimato": true.
- Piatti fatti in casa (per esempio "pasta al pomodoro", "pollo e patate"): scomponi negli ingredienti con quantità tipiche, olio compreso quando è probabile che ci sia, e metti "stimato": true sulle quantità che hai stimato tu. Pizza, panini del bar, fast food e piatti del ristorante: una sola voce.
- "meal": "colazione", "pranzo", "cena" o "spuntini" se il testo dice quando; altrimenti null.
- "name": nome breve in italiano.

Rispondi SOLO con JSON in questa forma:
{"items":[{"fid":"d-pasta","name":"Pasta di semola","st":"crudo","g":100,"kcal":null,"p":null,"c":null,"f":null,"meal":"pranzo","stimato":false}]}

ARCHIVIO (id|nome):
${arch}

TESTO DELL'UTENTE:
"""${text.slice(0, 2000)}"""`;
}
function aiClean(res){
  const arr = Array.isArray(res) ? res : res && Array.isArray(res.items) ? res.items : [];
  return arr.slice(0, 30).map(x => {
    if(!x || typeof x !== 'object') return null;
    const g = num(x.g); if(!g || g <= 0 || g > 5000) return null;
    const meal = MEALS.some(([m]) => m === x.meal) ? x.meal : null;
    const f = x.fid ? getFood(String(x.fid)) : null;
    if(f) return {on:true, fid:f.id, name:f.name, st:f.st || '', g:Math.round(g), k:f.k, p:f.p, c:f.c, f:f.f, meal, est:!!x.stimato};
    const p = num(x.p) || 0, c = num(x.c) || 0, fa = num(x.f) || 0; let k = num(x.kcal);
    if([p, c, fa].some(v => v < 0 || v > 100)) return null;
    const calc = 4 * p + 4 * c + 9 * fa;
    if(k == null || k < 0 || k > 950 || k < calc - 30) k = calc;
    const name = String(x.name || '').trim().slice(0, 60); if(!name) return null;
    return {on:true, fid:null, name, st:['crudo', 'cotto'].includes(x.st) ? x.st : '', g:Math.round(g), k:Math.round(k), p:r1(p), c:r1(c), f:r1(fa), meal, est:!!x.stimato};
  }).filter(Boolean);
}
function looseJSON(r){
  const t = String(r && r.text != null ? r.text : r || '');
  try{ return JSON.parse(t); }catch(e){}
  const i = t.search(/[\[{]/), j = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  if(i >= 0 && j > i){ try{ return JSON.parse(t.slice(i, j + 1)); }catch(e){} }
  throw {code:'invalid_json', message:'no json'};
}
async function aiGo(){
  const text = (S.aiText || '').trim(); if(!text){ toast('Scrivi prima cosa hai mangiato.'); return; }
  if(!S.sample || (S.ai && S.ai.busy)) return;
  if(!S.aiMeal) S.aiMeal = mealNow();
  const ctl = new AbortController(); S.ai = {busy:true, ctl}; render();
  try{
    const opts = {signal:ctl.signal, modelTier:'default'};
    const res = typeof S.sample.json === 'function' ? await S.sample.json(aiPrompt(text), opts)
      : looseJSON(await S.sample(aiPrompt(text), opts));
    const items = aiClean(res);
    if(!items.length){ S.ai = null; render(); toast('Non ho trovato alimenti nel testo: prova a scriverlo in modo più semplice.'); return; }
    S.ai = {busy:false, items}; render();
  }catch(e){
    S.ai = null; const c = e && e.code;
    if(['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) S.sampleOff = true;
    render();
    if(c === 'cancelled') return;
    toast(S.sampleOff ? "Claude non è disponibile qui: aggiungi dall'archivio." : c === 'rate_limited' ? 'Troppe richieste a Claude: riprova tra qualche minuto.'
      : c === 'invalid_json' || c === 'empty_completion' ? 'Non ho capito la risposta: riprova o scrivi in modo più semplice.' : c === 'refused' ? 'Claude non ha elaborato questo testo: riscrivilo.'
      : c === 'session_expired' ? 'Accedi di nuovo a Claude e riprova.' : 'Claude non risponde ora: riprova tra poco.');
  }
}

function weightChartHTML(){
  const today = todayISO(); const pts = weighList().filter(e => e.date >= addDays(today, -55));
  if(!pts.length) return `<p class="small muted" style="padding:8px 4px;margin:0">Ancora nessuna pesata: segna la prima qui sopra.</p>`;
  const W = 326, H = 172, X0 = 40, X1 = 314, YT = 18, YB = 142;
  const first = pts[0].date < addDays(today, -13) ? pts[0].date : addDays(today, -13); const span = daysBetween(first, today);
  const X = d => X0 + daysBetween(first, d) / span * (X1 - X0);
  const avg = pts.map(p => ({date:p.date, v:avgAt(p.date)}));
  let lo = Math.min(...pts.map(p => p.kg)), hi = Math.max(...pts.map(p => p.kg));
  if(hi - lo < 1){ const m = (hi + lo) / 2; lo = m - .5; hi = m + .5; }
  const {a, b, ticks} = niceRange(lo, hi);
  const Y = v => YB - (v - a) / (b - a) * (YB - YT);
  let g = '';
  ticks.forEach(t => { g += `<line x1="${X0}" y1="${Y(t).toFixed(1)}" x2="${X1}" y2="${Y(t).toFixed(1)}" stroke="#E3EFE7"/><text x="${X0 - 8}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#4F6B5A">${fmtKg(t)}</text>`; });
  const lbls = span >= 28 ? [first, addDays(first, Math.round(span / 2)), today] : [first, today];
  lbls.forEach((d, i) => { g += `<text x="${X(d).toFixed(1)}" y="164" text-anchor="${i === 0 ? 'start' : i === lbls.length - 1 ? 'end' : 'middle'}" font-size="11" fill="#4F6B5A">${fmtDM(d)}</text>`; });
  pts.forEach(p => { g += `<circle cx="${X(p.date).toFixed(1)}" cy="${Y(p.kg).toFixed(1)}" r="3.5" fill="#FFFFFF" stroke="#7FA88C" stroke-width="1.8"><title>${esc(fmtShort(p.date))}: ${fmtKg(p.kg)} kg</title></circle>`; });
  if(avg.length > 1) g += `<polyline points="${avg.map(p => `${X(p.date).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ')}" fill="none" stroke="#0C7830" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  const la = avg[avg.length - 1]; const lx = X(la.date), ly = Y(la.v);

  const left = lx > X0 + 110; g += `<text x="${(left ? lx - 8 : lx + 10).toFixed(1)}" y="${Math.max(12, ly - 12).toFixed(1)}" text-anchor="${left ? 'end' : 'start'}" font-size="12" font-weight="700" fill="#101814">media ${fmtKg(r1(la.v))} kg</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pesate delle ultime settimane e media di 7 giorni: ultima media ${fmtKg(r1(la.v))} kg" font-family="Figtree, sans-serif">${g}</svg>`;
}

function nutriSave(){

   ===================================================================== */
const MIG_COLS = ['workouts', 'exercises', 'food', 'body', 'foods', 'meals', 'checkins'];
function otherKeys(){ const out = []; try{ for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k && k !== Q_KEY && !k.startsWith('__')) out.push(k); } }catch(e){} return out; }
function exportPayload(){
  const storage = {};
  otherKeys().forEach(k => { try{ storage[k] = localStorage.getItem(k); }catch(e){} });
  return JSON.stringify({app:'limone-gym', v:1, at:new Date().toISOString(), storage});
}
/* cerca dentro qualunque JSON l'oggetto con gli allenamenti */
function findStore(x, depth){
  if(x == null || depth > 5) return null;
  if(typeof x === 'string'){ const t = x.trim(); if(t[0] !== '{' && t[0] !== '[') return null; try{ return findStore(JSON.parse(t), depth + 1); }catch(e){ return null; } }
  if(typeof x !== 'object' || Array.isArray(x)) return null;
  if(x.workouts && typeof x.workouts === 'object') return x;
  const keys = Object.keys(x).sort((a, b) => (b === LS_KEY) - (a === LS_KEY));
  for(const k of keys){ const r = findStore(x[k], depth + 1); if(r) return r; }
  return null;
}
const asMap = v => {
  if(!v || typeof v !== 'object') return {};
  if(Array.isArray(v)){ const o = {}; v.forEach(d => { if(d && typeof d === 'object') o[String(d.id || uid())] = d; }); return o; }
  return v;
};
const okId = id => /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id) && id !== '.' && id !== '..';
function parseImport(text){
  let raw; try{ raw = JSON.parse(String(text || '').trim()); }catch(e){ return {err:'Il testo non è completo: ricopialo tutto dalla copia sul telefono.'}; }
  const st = findStore(raw, 0); if(!st) return {err:'Non trovo allenamenti in questi dati.'};
  const writes = []; const n = {workouts:0, exercises:0, food:0, body:0, foods:0, meals:0, checkins:0};
  MIG_COLS.forEach(col => {
    const m = asMap(st[col]);
    Object.entries(m).forEach(([id, d]) => {
      if(!d || typeof d !== 'object' || !okId(id)) return;
      const data = {...d}; delete data.id;
      if(col === 'workouts' && (!data.date || !Array.isArray(data.exercises))) return;
      if(col === 'exercises' && !data.name) return;
      if(data.photo && JSON.stringify(data).length > 240000) delete data.photo;
      if(JSON.stringify(data).length > 250000) return;
      writes.push([col, id, data]); n[col]++;
    });
  });
  const prof = st.profile && (st.profile.main || (st.profile.name ? st.profile : null));
  if(prof && typeof prof === 'object'){ const p = {...prof}; delete p.id; writes.push(['profile', 'main', p]); }
  const nut = st.nutri && (st.nutri.settings || (st.nutri.kcal ? st.nutri : null));
  if(nut && typeof nut === 'object'){ const x = {...nut}; delete x.id; writes.push(['nutri', 'settings', x]); }
  if(!writes.length) return {err:'Questi dati sono vuoti.'};
  return {writes, n, prof, nut};
}
function importSummary(r){
  const bits = [];
  if(r.n.workouts) bits.push(`${r.n.workouts} ${r.n.workouts === 1 ? 'allenamento' : 'allenamenti'}`);
  if(r.n.exercises) bits.push(`${r.n.exercises} ${r.n.exercises === 1 ? 'esercizio tuo' : 'esercizi tuoi'}`);
  if(r.n.food) bits.push(`${r.n.food} giornate di cibo`);
  if(r.n.body) bits.push(`${r.n.body === 1 ? '1 mese' : r.n.body + ' mesi'} di pesate`);
  if(r.prof) bits.push(`il profilo${r.prof.name ? ' di ' + r.prof.name : ''}`);
  return bits.join(', ');
}

function previewImport(text){
  const r = parseImport(text); S.imp = r.err ? null : r;
  const pv = $('#impPv'), b = $('#impGo'); if(!pv) return;
  pv.innerHTML = !String(text || '').trim() ? '' : r.err ? `<div class="verdict bad">${esc(r.err)}</div>`
    : `<div class="verdict ok">Trovati: ${esc(importSummary(r))}. Gli allenamenti già presenti qui restano.</div>`;
  if(b) b.disabled = !S.imp;
}
async function runImport(){
  const r = S.imp; if(!r || S.importing) return;
  S.importing = true; const b = $('#impGo'); if(b){ b.disabled = true; b.textContent = 'Importo…'; }
  let ok = 0, fail = 0; const tot = r.writes.length;
  const all = S.mode === 'local' ? lsRead() : null;
  for(const [col, id, data0] of r.writes){
    let data = data0;
    if(col === 'profile') data = {...(S.profile || {}), ...Object.fromEntries(Object.entries(data0).filter(([, v]) => v != null && v !== ''))};
    if(col === 'nutri' && S.nutri){ ok++; continue; }
    if(all){ all[col] = all[col] || {}; all[col][id] = data; ok++; continue; }
    const key = col + '/' + id; let done = false;
    for(let t = 0; t < 3 && !done; t++){
      try{ await S.db.doc(key).set(data); done = true; }
      catch(e){ if(e && (e.code === 'invalid_argument' || e.code === 'quota_exceeded')) break; await new Promise(res => setTimeout(res, 800 * (t + 1))); }
    }
    if(done) ok++; else { fail++; qAdd(key, data); }
    if(b) b.textContent = `Importo… ${ok + fail}/${tot}`;
  }
  if(all){ lsWrite(all); loadLocal(); }
  if(r.prof) S.profile = {...(S.profile || {}), ...r.prof};
  S.importing = false; closeSheet(); render();
  toast(fail ? `Importati ${ok} dati su ${tot}: gli altri li invio appena la rete va.` : `Fatto: ${importSummary(r)}.`);
}
Object.assign(A, {
  exportOpen: () => openExport(),
  exportCopy: () => copyExport(),
  exportFile: () => fileExport(),
  importOpen: () => openImport(),
  impGo: () => runImport(),
});
function migInput(el){ if(el.id === 'impText'){ previewImport(el.value); return true; } return false; }
async function migChange(el){
  if(el.id !== 'impFile' || !el.files || !el.files[0]) return false;
  try{ const t = await el.files[0].text(); const ta = $('#impText'); if(ta) ta.value = t.length > 5000 ? '(dati dal file)' : t; previewImport(t); }
  catch(e){ toast('Non riesco a leggere questo file.'); }
  return true;
}

render();
initStore();

</script>
